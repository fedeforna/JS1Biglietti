<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema</title>
    <link rel="stylesheet" href="./CSS/styles.css">
</head>
<body>

    <div class="w-100 h-25">
        <img class="gif" src="./images/giphy.gif" alt="Video Matrix">
    </div>

    <!-- Modificato: Aggiunte le classi d-flex flex-column-reverse flex-md-row per invertire l'ordine su mobile -->
    <div class="row text-center bg-black d-flex flex-column-reverse flex-md-row">
        <div class="col-md-6 col-sm-12">
            <h1 class="text-light">Biglietti cinema</h1>

            <ul class="text-success testo">
                <li>Costo per tutti:<span>  8€</span></li>
                <li>Costo minori di 5 anni:<span>  free</span></li>
                <li>Costo per clienti con età compresa tra i 18 e i 25:<span>  3.5€</span></li>
                <li>Costo per clienti con età comprersa tra i 50 e i 55:<span>  5€</span></li>
            </ul>
        </div>

        <div class="col-md-6 col-sm-12">
            <h1 class="text-light">Lo script</h1>
            <button type="button"  onclick="compra()"  class="btn btn-light m-3">Acquista</button>

        </div>
    </div>

    <script src="./js/spript.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
